# Render Blueprint — describes the full stack so you can deploy with one click
# from a Git repo connected to Render.
#
# After connecting the repo:
#   1. Render will read this file and propose two services.
#   2. Set the secret env vars (MONGO_URI, JWT_SECRET, CLIENT_ORIGIN, VITE_API_URL)
#      in the Render dashboard — they are NOT in this file because they are secrets.
#   3. Click Apply.

services:
  # --- Backend API (Node + Express) ---
  - type: web
    name: attendit-backend
    runtime: node
    rootDir: attendit-backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false        # set this in the Render dashboard (Atlas connection string)
      - key: JWT_SECRET
        sync: false        # set this in the Render dashboard (long random string)
      - key: CLIENT_ORIGIN
        sync: false        # set to your frontend URL, e.g. https://attendit-web.onrender.com

  # --- Frontend (Vite static site) ---
  - type: web
    name: attendit-web
    runtime: static
    rootDir: attend_it-web
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false        # set to your backend URL + /api, e.g. https://attendit-backend.onrender.com/api
    routes:
      # SPA fallback: every unknown path returns index.html so React Router can take over
      - type: rewrite
        source: /*
        destination: /index.html
