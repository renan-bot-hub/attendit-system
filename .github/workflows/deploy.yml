name: CI and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: attendit-backend
        run: npm ci

      - name: Run backend tests
        working-directory: attendit-backend
        run: npm test

      - name: Install web dependencies
        working-directory: attend_it-web
        run: npm ci

      - name: Lint web
        working-directory: attend_it-web
        run: npm run lint

      - name: Build web
        working-directory: attend_it-web
        run: npm run build

  deploy:
    name: Trigger Render deploy
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger backend deploy
        env:
          RENDER_BACKEND_DEPLOY_HOOK_URL: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}
        run: |
          test -n "$RENDER_BACKEND_DEPLOY_HOOK_URL"
          curl -fsS -X POST "$RENDER_BACKEND_DEPLOY_HOOK_URL"

      - name: Trigger frontend deploy
        env:
          RENDER_WEB_DEPLOY_HOOK_URL: ${{ secrets.RENDER_WEB_DEPLOY_HOOK_URL }}
        run: |
          test -n "$RENDER_WEB_DEPLOY_HOOK_URL"
          curl -fsS -X POST "$RENDER_WEB_DEPLOY_HOOK_URL"
